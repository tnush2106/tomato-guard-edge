[platformio]
default_envs = esp32_hat
build_dir = .pio/build
libdeps_dir = .pio/libdeps

[env:esp32_hat]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 38400
upload_flags =
    --no-stub
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit SHT31 Library@2.2.2
    claws/BH1750@1.3.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit ILI9341@1.6.2
    adafruit/Adafruit BusIO@1.16.2
build_flags =
    -Wall
    -Wextra
